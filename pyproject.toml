[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamlake-autodoc-py"
version = "0.2.0a1"
description = "Import-free Python API documentation for DreamLake Dockit"
readme = "README.md"
keywords = ["documentation", "python", "mdx", "dockit", "autodoc"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "DreamLake AI"}]

[project.urls]
Homepage = "https://dockit.dreamlake.ai/python-autodoc/"
Documentation = "https://dockit.dreamlake.ai/python-autodoc/usage"
Repository = "https://github.com/dreamlake-ai/autodoc-py"
Issues = "https://github.com/dreamlake-ai/autodoc-py/issues"
Changelog = "https://dockit.dreamlake.ai/python-autodoc/release-notes"

[project.scripts]
autodoc-py = "autodoc_py:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodoc_py = ["*.css"]
